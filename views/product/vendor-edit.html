<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Edit Vendor</title>
    <link rel="stylesheet" href="/css/app.css">
  </head>
  <body>
    <main class="page">
      <h1>Edit Vendor</h1>
      <form method="post" action="/vendors/edit/{{id}}">
        <div>
          Vendor Name:
          <input type="text" name="vendor_name" value="{{name}}" maxlength="255">
        </div>
        <div class="button-row">
          <button type="submit">Save</button>
          <a class="button-link" href="/vendors">Back</a>
        </div>
      </form>
    </main>
  </body>
</html>
