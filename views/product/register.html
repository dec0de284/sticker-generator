<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Register Product</title>
    <link rel="stylesheet" href="/css/app.css">
  </head>
  <body>
    <main class="page">
      <h1>Register Product</h1>
      <form method="post" action="/register/json" id="registerForm">
        <div>Item: <input type="text" name="item" value="G/EPON ONU"></div>
        <div>Specification: <input type="text" name="spec" value="V2802ACT"></div>
        <div>Power: <input type="text" name="power" value="DC 12V ⎓ 1A"></div>
        <div>Management IP: <input type="text" name="mgmt_ip" value="192.168.1.1"></div>
        <div>Username/Password: <input type="text" name="cred" value="user/user"></div>
        <div>WiFi SSID(5G): <input type="text" name="ssid_5g" value="FTTH-5G"></div>
        <div>WiFi SSID(2.4G): <input type="text" name="ssid_24g" value="FTTH"></div>
        <div>WiFi Key(WPA)(2.4G/5G): <input type="text" name="wifi_key" value="12345678"></div>
        <div>MAC: <input type="text" name="mac" value=""></div>
        <div>PON S/N: <input type="text" name="pon_sn" value=""></div>
        <div>S/N: <input type="text" name="sn" value=""></div>
        <div>
          Vendor:
          <select name="vendor_id">
            {{vendorOptions}}
          </select>
        </div>
        <div class="button-row">
          <button type="submit" id="registerSubmitBtn">Submit</button>
          <a class="button-link" href="/">Back</a>
        </div>
      </form>
      <script src="/js/product/registerPage.js"></script>
    </main>
  </body>
</html>
